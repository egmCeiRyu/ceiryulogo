<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Empty Project</title>
    <meta itemprop="name" content="Empty Project">
    <meta name="twitter:title" content="Empty Project">
    <meta property="og:title" content="Empty Project">
    <meta property="og:site_name" content="Empty Project">
    <meta name="description" content="Start with a blank project.">
    <meta itemprop="description" content="Start with a blank project.">
    <meta property="og:description" content="Start with a blank project.">
    <meta name="twitter:description" content="Start with a blank project.">
    
    <script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>
    <script crossorigin="anonymous" src="./external/xr/xr.js" async="true" data-preload-chunks="face, slam"></script>

    <style>
        /* 【新規】カメラが起動するまで画面全体を隠すスタイル */
        body {
            background-color: #000000; /* カメラ起動前は黒画面（またはローディング画面） */
        }
        
        canvas {
            opacity: 0;
            transition: opacity 0.5s ease; /* ふわっと表示させるアニメーション */
        }

        canvas.camera-ready {
            opacity: 1 !important;
        }

        /* スクリーンショットボタンのスタイリング */
        .screenshot-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            width: 70px;
            height: 70px;
            background-color: rgba(255, 255, 255, 0.7);
            border: 5px solid #ffffff;
            border-radius: 50%;
            cursor: pointer;
            outline: none;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s ease, background-color 0.2s;
            visibility: hidden; /* カメラが起動するまでボタンも隠す */
        }

        .screenshot-btn.camera-ready {
            visibility: visible;
        }

        /* ボタンを押したときのエフェクト */
        .screenshot-btn:active {
            transform: translateX(-50%) scale(0.9);
            background-color: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body>
    <button id="screenshot" class="screenshot-btn" aria-label="写真を撮る"></button>

    <script src="bundle.js"></script>

    <script>
        // ページ読み込み時に8th Wallのスクリーンショットモジュールを有効化
        window.addEventListener('xrloaded', () => {
            if (window.XR8 && XR8.canvasScreenshot) {
                XR8.addCameraPipelineModule(XR8.canvasScreenshot().cameraPipelineModule());
                console.log("8th Wall Screenshot module loaded.");
            }

            // 【新規】8th Wallのカメラフィードが実際に開始されたイベントを検知
            XR8.addCameraPipelineModule({
                name: 'camera-ready-detector',
                onStart: () => {
                    console.log("Camera is running and active!");
                    
                    // カメラが無事に起動したら、一瞬遅らせて3Dとキャンバスを綺麗にフェードイン表示させる
                    setTimeout(() => {
                        const canvas = document.querySelector('canvas');
                        const btn = document.getElementById('screenshot');
                        
                        if (canvas) canvas.classList.add('camera-ready');
                        if (btn) btn.classList.add('camera-ready');
                    }, 300); // 300msの微調整（環境に合わせて変更可能）
                }
            });
        });

        // スクリーンショット撮影ロジック
        document.getElementById('screenshot').addEventListener('click', async () => {
            if (typeof XR8 === 'undefined' || !XR8.canvasScreenshot) {
                console.error("XR8 または Screenshot モジュールが見つかりません。");
                return;
            }

            try {
                // 1. 8th WallのAPIからBase64文字列を取得
                const base64Data = await XR8.canvasScreenshot().takeScreenshot();
                
                if (!base64Data) {
                    throw new Error("スクリーンショットのデータが空です。");
                }

                // 2. データをJPGのデータURLスキームに変形
                const dataUrl = "data:image/jpeg;base64," + base64Data;
                
                // 3. Base64データをバイナリ（Blob）に変換
                const response = await fetch(dataUrl);
                const blob = await response.blob();
                
                // 4. ファイルオブジェクトを作成
                const filename = `screenshot_${Date.now()}.jpg`;
                const file = new File([blob], filename, { type: 'image/jpeg' });

                // 5. ネイティブシェア画面の起動チェック
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: 'AR Photo',
                        text: 'ARで撮影した写真です！'
                    });
                } else {
                    // 通常のダウンロードフォールバック
                    const link = document.createElement('a');
                    link.download = filename;
                    link.href = dataUrl;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            } catch (error) {
                console.error("エラーが発生しました:", error);
                alert("写真の処理中にエラーが発生しました。");
            }
        });
    </script>
</body>
</html>
