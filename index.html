<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Empty Project</title>
  <meta itemprop="name" content="Empty Project">
  <meta name="twitter:title" content="Empty Project">
  <meta property="og:title" content="Empty Project">
  <meta property="og:site_name" content="Empty Project">
  <meta name="description" content="Start with a blank project.">
  <meta itemprop="description" content="Start with a blank project.">
  <meta property="og:description" content="Start with a blank project.">
  <meta name="twitter:description" content="Start with a blank project.">
  
  <script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>
  
  <script crossorigin="anonymous" src="./external/xr/xr.js" async="true" data-preload-chunks="image, slam"></script>

  <style>
        /* Estilização do botão de Screenshot */
        .screenshot-btn {
            position: absolute;
            bottom: 30px; /* Distância do fundo da tela */
            left: 50%;
            transform: translateX(-50%);
            z-index: 999; /* Garante que fique acima do canvas do AR */
            width: 70px;
            height: 70px;
            background-color: rgba(255, 255, 255, 0.7);
            border: 5px solid #ffffff;
            border-radius: 50%;
            cursor: pointer;
            outline: none;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s ease, background-color 0.2s;
        }

        /* Efeito de clique do botão */
        .screenshot-btn:active {
            transform: translateX(-50%) scale(0.9);
            background-color: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body>
    <button id="screenshot" class="screenshot-btn" aria-label="Tirar Foto"></button>

    <script src="bundle.js"></script>

<script>
        document.getElementById('screenshot').addEventListener('click', async () => {
            // 1. 8th Wallが描画しているcanvas要素を取得
            const canvas = document.querySelector('canvas');
            
            if (!canvas) {
                console.error("ARのCanvasが見つかりませんでした。");
                return;
            }

            try {
                // 2. 画質92%のJPG形式でBase64データを取得
                const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
                
                // 3. Base64データをバイナリ（Blob）に変換する処理
                const response = await fetch(dataUrl);
                const blob = await response.blob();
                
                // 4. Web Share API用のファイルオブジェクトを作成
                const filename = `screenshot_${Date.now()}.jpg`;
                const file = new File([blob], filename, { type: 'image/jpeg' });

                // 5. ブラウザがファイルのシェアに対応しているかチェック
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    // ネイティブのシェア画面を直接起動
                    await navigator.share({
                        files: [file],
                        title: 'AR Photo',
                        text: 'ARで撮影した写真です！'
                    });
                    console.log("シェア画面が正常に開きました。");
                } else {
                    // 対応していない場合のフォールバック（通常のダウンロード）
                    console.warn("このブラウザはファイルの直接シェアに対応していません。通常ダウンロードを実行します。");
                    const link = document.createElement('a');
                    link.download = filename;
                    link.href = dataUrl;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            } catch (error) {
                console.error("エラーが発生しました:", error);
                alert("写真の処理中にエラーが発生しました。");
            }
        });
    </script>
</html>
