<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AR Project - Fixed Anchor Clone</title>
  
  <script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>
  <script crossorigin="anonymous" src="./external/xr/xr.js" async="true" data-preload-chunks="image, slam"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <script src="bundle.js"></script>

  <script>
    let jaEscaneou = false;

    window.addEventListener('xrloaded', () => {
      
      window.addEventListener('xrimagefound', (event) => {
        // Verifica se é o marcador correto e se é a primeira leitura
        if (event.detail.name === 'marker' && !jaEscaneou) {
          jaEscaneou = true;
          console.log("🎯 Alvo detectado! Clonando e fixando o personagem no mundo real...");

          // 1. Pega os dados tridimensionais exatos do papel na mesa
          const pos = event.detail.position;
          const rot = event.detail.rotation;
          const scale = event.detail.scale || {x: 1, y: 1, z: 1};

          if (window.ecs && window.ecs.application && window.ecs.application.scene) {
            const scene = window.ecs.application.scene;
            
            // IDs originais do seu projeto
            const idDoModeloOriginal = "e35dbf9c-8de2-468e-9449-f9563e988696";
            const modeloOriginal = scene.entities[idDoModeloOriginal];

            if (modeloOriginal) {
              // 2. CRIA UMA NOVA ENTIDADE (O CLONE) FIXA NO MUNDO
              const personagemFixo = scene.createEntity();
              
              // Define o pai dele direto na raiz do mundo (Default Space / SLAM)
              if (modeloOriginal.parent && modeloOriginal.parent.parent) {
                scene.changeParent(personagemFixo, modeloOriginal.parent.parent);
              }

              // 3. COPIA O MODELO 3D PARA O CLONE
              if (modeloOriginal.gltfModel) {
                personagemFixo.gltfModel = {
                  src: modeloOriginal.gltfModel.src,
                  animationClip: modeloOriginal.gltfModel.animationClip,
                  loop: modeloOriginal.gltfModel.loop
                };
              }

              // 4. TRAVA A POSIÇÃO E ROTAÇÃO NO ESPAÇO REAL
              // O objeto agora pertence ao chão e ignora para onde a câmera aponta
              personagemFixo.transform.position = [pos.x, pos.y, pos.z];
              personagemFixo.transform.rotation = [rot.x, rot.y, rot.z, rot.w || 1];
              personagemFixo.transform.scale = [scale.x, scale.y, scale.z];

              // Força o clone a ficar visível para sempre
              personagemFixo.visibleComponent = { visible: true };

              // 5. DELETA O MODELO ORIGINAL DO MARCADOR
              // Remove o objeto que ficava sumindo e rotacionando com a foto
              scene.destroyEntity(modeloOriginal);

              console.log("🚀 Personagem clonado e imobilizado com sucesso no SLAM!");
            }
          }
        }
      });
    });
  </script>

</body>
</html>
