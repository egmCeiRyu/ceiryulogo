<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AR Project - Fixado Definitivo</title>
  
  <script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>
  <script crossorigin="anonymous" src="./external/xr/xr.js" async="true" data-preload-chunks="image, slam"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <script src="bundle.js"></script>

  <script>
    let jáEscaneou = false;

    // Aguarda o motor do 8th Wall inicializar
    window.addEventListener('xrloaded', () => {
      
      // 1. Interceptamos o evento de quando o motor PERDE o papel de vista
      window.addEventListener('xrimagelost', (event) => {
        if (jáEscaneou) {
          // 🔥 TRUQUE DE MESTRE: Paramos o erro imediatamente!
          // Impedimos que o 8th Wall avise os componentes internos para sumirem com o personagem.
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true); // O 'true' garante que a gente capture o evento ANTES do bundle rodar

      // 2. Quando a câmera achar o anime pela primeira vez
      window.addEventListener('xrimagefound', (event) => {
        if (event.detail.name === 'marker' && !jáEscaneou) {
          jáEscaneou = true;
          console.log("🎯 Alvo detectado a primeira vez! Travando o personagem...");

          // Avisamos o motor do 8th Wall para parar de recalcular a posição da imagem.
          // Assim ele não rotaciona mais junto com o papel e fica preso no espaço real (SLAM).
          setTimeout(() => {
            if (window.XR8 && window.XR8.XrController) {
              window.XR8.XrController.configure({ imageTargetData: [] });
            }
          }, 200);
        }
      });

    });
  </script>

</body>
</html>
